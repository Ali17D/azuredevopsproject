trigger:
  branches:
    include:
      - master
      - develop

pr:
  branches:
    include:
      - master

variables:
- group: esprit
- name: APP_NAME
  value: 'gestion-signalement'
- name: IMAGE_TAG
  value: '$(Build.BuildId)'
- name: DOCKERHUB_REPO
  value: 'ali170600/gestion-signalement'
- name: APP_DIR
  value: '/home/ali/app'
- name: MAVEN_OPTS
  value: '-Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository'
- name: JAVA_HOME_PATH
  value: '/usr/lib/jvm/java-8-openjdk-amd64/jre'

stages:
- stage: BuildAndDeploy
  displayName: 'Build, Test, Docker & Deploy'
  jobs:
  - job: FullPipeline
    displayName: 'Full Pipeline'
    pool:
      name: Default

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: musee_signalement
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppassword

    steps:
    - checkout: self
      fetchDepth: 1
      persistCredentials: true

    - script: |
        echo "SourceBranch: $(Build.SourceBranch)"
        echo "BuildReason: $(Build.Reason)"
        echo "Username Docker: $(DOCKERHUB_USERNAME)"
        echo "Password défini: $( [ -n "$(DOCKERHUB_PASSWORD)" ] && echo 'OUI' || echo 'NON' )"
      displayName: 'Debug variables'

    - script: |
        export JAVA_HOME=$(JAVA_HOME_PATH)
        export PATH=$JAVA_HOME/bin:$PATH
        echo "JAVA_HOME=$JAVA_HOME"
        java -version
        mvn -version
      displayName: 'Vérifier Java & Maven'

    - script: |
        echo "Waiting for MySQL..."
        for i in $(seq 1 30); do
          if mysqladmin ping -h 127.0.0.1 -u root -proot --silent 2>/dev/null; then
            echo "MySQL ready!"
            break
          fi
          echo "Attempt $i: not ready, waiting 3s..."
          sleep 3
        done
      displayName: 'Attendre MySQL'

    - script: |
        export JAVA_HOME=$(JAVA_HOME_PATH)
        export PATH=$JAVA_HOME/bin:$PATH
        cd $(Build.SourcesDirectory)/gestion-signalement-main
        mvn compile -B $(MAVEN_OPTS)
      displayName: 'Compilation Maven'

    - script: |
        export JAVA_HOME=$(JAVA_HOME_PATH)
        export PATH=$JAVA_HOME/bin:$PATH
        cd $(Build.SourcesDirectory)/gestion-signalement-main
        mvn test -B $(MAVEN_OPTS) \
          -Dspring.datasource.url="jdbc:mysql://127.0.0.1:3306/musee_signalement?useSSL=false&allowPublicKeyRetrieval=true" \
          -Dspring.datasource.username=appuser \
          -Dspring.datasource.password=apppassword \
          -Dspring.jpa.hibernate.ddl-auto=create-drop \
          -Dspring.profiles.active=test
      displayName: 'Tests JUnit'
      continueOnError: true

    - task: PublishTestResults@2
      displayName: 'Publier résultats tests'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'

    - script: |
        export JAVA_HOME=$(JAVA_HOME_PATH)
        export PATH=$JAVA_HOME/bin:$PATH
        cd $(Build.SourcesDirectory)/gestion-signalement-main
        mvn package -B $(MAVEN_OPTS) -DskipTests
      displayName: 'Package JAR'

    - script: |
        set -e
        echo "$(DOCKERHUB_PASSWORD)" | docker login -u "$(DOCKERHUB_USERNAME)" --password-stdin
        echo "LOGIN OK"
      displayName: 'Docker Login'

    - script: |
        set -e
        cd $(Build.SourcesDirectory)/gestion-signalement-main
        cp target/$(APP_NAME).jar .
        docker build -t $(DOCKERHUB_REPO):$(IMAGE_TAG) -f Dockerfile .
        docker tag $(DOCKERHUB_REPO):$(IMAGE_TAG) $(DOCKERHUB_REPO):latest
        docker push $(DOCKERHUB_REPO):$(IMAGE_TAG)
        docker push $(DOCKERHUB_REPO):latest
        echo "Image pushée : $(DOCKERHUB_REPO):$(IMAGE_TAG)"
      displayName: 'Build & Push Docker Hub'

    - script: |
        set -e
        cd $(APP_DIR)
        docker pull $(DOCKERHUB_REPO):$(IMAGE_TAG)
        docker tag $(DOCKERHUB_REPO):$(IMAGE_TAG) $(DOCKERHUB_REPO):latest
        docker-compose up -d --no-deps --pull always app
        docker image prune -f
        docker-compose ps
      displayName: 'Deploy docker-compose'

    - script: |
        echo "Attente démarrage (30s)..."
        sleep 30
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/aec-api-rest/signalements || echo "000")
        echo "HTTP Status: $STATUS"
        if [ "$STATUS" = "200" ]; then
          echo "Health check OK"
        else
          echo "Status $STATUS — logs app:"
          docker logs gestion-signalement --tail=30
        fi
      displayName: 'Health Check'
      continueOnError: true